# Used only by the test suite (Miniflare). Not deployable: IDs are placeholders.
name = "plasmatrack-bot-test"
main = "src/index.ts"
compatibility_date = "2026-08-15"

[[d1_databases]]
binding = "DB"
database_name = "plasmatrack-bot-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RENDER_CACHE"
bucket_name = "plasmatrack-render-cache-test"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "plasmatrack-backups-test"

[[queues.producers]]
binding = "WORK_QUEUE"
queue = "plasmatrack-work-test"

[[queues.consumers]]
queue = "plasmatrack-work-test"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "plasmatrack-work-test-dlq"

[[queues.consumers]]
queue = "plasmatrack-work-test-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

[vars]
DISCORD_APPLICATION_ID = "100000000000000001"
NOTICE_TTL_DAYS = "30"
RENDERER_URL = "https://renderer.test"
# DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN, RENDERER_KEY and PLASMATRACK_WEBHOOK_SECRET_PRODUCTION
# are injected by vitest.config.ts.

[vars.GUILDS.200000000000000002]
backend = "production"
member_roles = ["300000000000000013"]
moderator_roles = ["300000000000000003"]

[vars.BACKENDS.production]
