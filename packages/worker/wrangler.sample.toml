# PlasmaTrack bot: Cloudflare Worker configuration.
# Copy to wrangler.toml (git-ignored) and fill in your own IDs. See docs/DEPLOY.md.
#
# Secrets are NOT set here. Set them with:
#   npx wrangler secret put DISCORD_BOT_TOKEN
#   npx wrangler secret put RENDERER_KEY
# For `wrangler dev`, put them in .dev.vars instead (see .dev.vars.example).

name = "plasmatrack-bot"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# Serves POST /interactions (Discord) and GET /healthz.
# Point the Discord application's "Interactions Endpoint URL" at
# https://<your-worker-host>/interactions

[[d1_databases]]
binding = "DB"
database_name = "plasmatrack-bot"
database_id = "<from `npx wrangler d1 create plasmatrack-bot`>"
migrations_dir = "migrations"

# Rendered route/chart PNG cache. Add an R2 lifecycle rule (e.g. delete after 30 days).
[[r2_buckets]]
binding = "RENDER_CACHE"
bucket_name = "plasmatrack-render-cache"

# Deferred work: everything slower than Discord's 3-second window.
[[queues.producers]]
binding = "WORK_QUEUE"
queue = "plasmatrack-work"

[[queues.consumers]]
queue = "plasmatrack-work"
max_batch_size = 10
max_batch_timeout = 1   # seconds; keep low, users are waiting on "thinking…"
max_retries = 5        # keep in sync with MAX_RETRIES in src/index.ts
dead_letter_queue = "plasmatrack-work-dlq"

# Messages out of retries: the same Worker logs what was lost and drops them.
[[queues.consumers]]
queue = "plasmatrack-work-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

# Workers Logs: keeps the bot's JSON log lines (secrets are masked before logging),
# searchable in the Cloudflare dashboard for a few days.
[observability]
enabled = true
head_sampling_rate = 1

# Daily cleanup of expired dedupe rows and notices.
[triggers]
crons = ["17 3 * * *"]

[vars]
DISCORD_APPLICATION_ID = "<application id>"
DISCORD_PUBLIC_KEY = "<application public key, 64 hex chars>"
NOTICE_TTL_DAYS = "30"
RENDERER_URL = "https://<your renderer host>"

# One table per Discord server. Commands work only in these servers (never in DMs), and
# every command except /about needs one of the listed roles. With no member_roles, only
# moderators can use PlasmaTrack in that server.
[vars.GUILDS."<server id>"]
backend = "production"
member_roles = ["<role id>"]
moderator_roles = ["<role id>"]
# Channel for review-queue posts; "" for none.
review_channel = ""

# A test server, kept apart from production data by its own backend.
# [vars.GUILDS."<test server id>"]
# backend = "test"
# member_roles = ["<role id>"]
# moderator_roles = ["<role id>"]
# review_channel = "<channel id>"

# PlasmaTrack backends by name (lowercase letters and digits). A backend with api_url needs the
# secret PLASMATRACK_BOT_TOKEN_<NAME>; webhooks need PLASMATRACK_WEBHOOK_SECRET_<NAME>. Leave
# api_url out until the server exists: commands then say it isn't connected.
[vars.BACKENDS.production]
# api_url = "https://<server host>"

# [vars.BACKENDS.test]
# demo = true          # built-in made-up data, until a test server exists
